<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Listinha do momo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#5c1220; --wine-2:#7a1a2b; --ivory:#fbf3e4; --ivory-2:#fffaf2;
    --gold:#e2b65b; --ink:#3a0d16; --muted:#7a4a52; --soft:#6b4a50; --line:#e4d3bd; --heart:#b3243b;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Figtree",system-ui,sans-serif;background:var(--wine);color:var(--ivory);min-height:100vh;line-height:1.45}
  .wrap{max-width:520px;margin:0 auto;padding:40px 20px 64px;display:flex;flex-direction:column;gap:22px}

  header{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:6px}
  h1{margin:0;font-family:"Young Serif",serif;font-weight:400;font-size:clamp(40px,11vw,52px);line-height:1.05}
  .days{margin:0;font-size:15px;color:var(--gold)}

  form{background:var(--ivory);color:var(--ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
  .form-title{margin:0;font-family:"Young Serif",serif;font-weight:400;font-size:20px;color:var(--ink)}
  .field{display:flex;flex-direction:column;gap:6px}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  label,.label{font-size:13px;font-weight:700;color:var(--muted)}
  input,textarea{
    font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:12px;
    background:var(--ivory-2);color:var(--ink);width:100%;min-width:0;outline:none
  }
  textarea{resize:vertical;min-height:52px}
  input::placeholder,textarea::placeholder{color:#a58a8e}
  input:focus,textarea:focus{border-color:var(--wine-2);box-shadow:0 0 0 3px rgba(122,26,43,.15)}
  .want{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .want button{
    font:inherit;font-size:13px;min-height:44px;border:1.5px solid var(--line);background:var(--ivory-2);
    color:var(--muted);border-radius:10px;cursor:pointer;padding:4px
  }
  .want button[aria-pressed="true"]{border-color:var(--wine);background:var(--wine);color:var(--ivory);font-weight:700}
  .btns{display:flex;gap:10px}
  .add{
    flex:1;font:inherit;font-weight:700;font-size:16px;min-height:48px;border:0;border-radius:10px;
    background:var(--gold);color:var(--ink);cursor:pointer
  }
  .add:hover{background:#d6a644}
  .add:disabled{opacity:.6;cursor:default}
  .cancel{
    font:inherit;font-weight:700;font-size:15px;min-height:48px;border:1.5px solid var(--line);border-radius:10px;
    background:transparent;color:var(--muted);padding:0 16px;cursor:pointer
  }

  .bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4px 2px 0;flex-wrap:wrap}
  .bar h2{margin:0;font-family:"Young Serif",serif;font-weight:400;font-size:26px}
  .count{font-size:14px;color:#e8c9cf}
  .sort{display:flex;gap:4px}
  .sort button{
    font:inherit;font-size:13px;border:1px solid rgba(251,243,228,.25);background:transparent;color:#e8c9cf;
    border-radius:999px;padding:6px 12px;cursor:pointer;min-height:34px
  }
  .sort button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}

  .list{display:flex;flex-direction:column;gap:12px}
  .tag{
    position:relative;background:var(--ivory);color:var(--ink);
    clip-path:polygon(22px 0,100% 0,100% 100%,22px 100%,0 50%);
    padding:16px 10px 16px 40px;display:flex;gap:10px
  }
  .tag::before{
    content:"";position:absolute;left:14px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--wine)
  }
  .tag .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
  .tag .title{font-weight:700;font-size:17px;word-break:break-word}
  .hearts{display:flex;align-items:center;gap:2px;color:var(--heart)}
  .hearts span{font-size:13px;margin-left:6px}
  .notes{font-size:14px;color:var(--soft);white-space:pre-wrap;word-break:break-word;margin:0}
  .info{font-size:14px;display:flex;flex-wrap:wrap;gap:4px 14px}
  .info a{color:var(--wine-2);font-weight:700;word-break:break-all}
  .info a:hover{color:var(--wine)}
  .tools{display:flex;flex-direction:column}
  .icon{width:44px;height:44px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:10px;display:grid;place-items:center}
  .icon:hover{background:#f1e4cf;color:var(--ink)}

  .empty{text-align:center;padding:32px 20px;color:#e8c9cf;border:1.5px dashed rgba(251,243,228,.35);border-radius:14px}
  .note{padding:12px 14px;border-radius:10px;background:#fff1c9;color:#5c4400;font-size:14px}
  .note.err{background:#ffe1e4;color:#7d1020}
  .hidden{display:none !important}
  :focus-visible{outline:2.5px solid var(--gold);outline-offset:2px}
  form :focus-visible{outline-color:#1b6ec2}

  .backdrop{position:fixed;inset:0;background:rgba(30,4,10,.6);display:grid;place-items:center;padding:20px;z-index:10}
  .dialog{background:var(--ivory);color:var(--ink);border-radius:14px;padding:22px;max-width:360px;width:100%}
  .dialog p{margin:0 0 16px;font-size:17px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg width="120" height="18" viewBox="0 0 120 18" aria-hidden="true"><path d="M0 9h46M74 9h46" stroke="#e2b65b" stroke-width="1.5"/><path d="M60 1l2.4 5.6L68 9l-5.6 2.4L60 17l-2.4-5.6L52 9l5.6-2.4z" fill="#e2b65b"/></svg>
    <h1>Listinha do momo</h1>
    <p class="days" id="days"></p>
  </header>

  <div id="status" class="note hidden" role="status"></div>

  <form id="wishForm" autocomplete="off">
    <h2 class="form-title" id="formTitle">Adicionar um desejo</h2>
    <div class="field">
      <label for="fTitle">O que você quer?</label>
      <input id="fTitle" maxlength="140" required placeholder="Ex.: perfume, livro, tênis">
    </div>
    <div class="grid2">
      <div class="field">
        <label for="fLink">Link</label>
        <input id="fLink" maxlength="600" inputmode="url" placeholder="Opcional">
      </div>
      <div class="field">
        <label for="fPrice">Preço</label>
        <input id="fPrice" maxlength="40" placeholder="R$">
      </div>
    </div>
    <div class="field">
      <label for="fNotes">Detalhes</label>
      <textarea id="fNotes" maxlength="600" rows="2" placeholder="Tamanho, cor, modelo… (opcional)"></textarea>
    </div>
    <div class="field">
      <span class="label" id="wantLabel">Quanto você quer?</span>
      <div class="want" id="wantPick" role="group" aria-labelledby="wantLabel">
        <button type="button" data-p="1" aria-pressed="false">Seria legal</button>
        <button type="button" data-p="2" aria-pressed="true">Quero bastante</button>
        <button type="button" data-p="3" aria-pressed="false">Quero muito</button>
      </div>
    </div>
    <div class="btns">
      <button type="button" class="cancel hidden" id="cancelEdit">Cancelar</button>
      <button type="submit" class="add" id="submitBtn">Adicionar à lista</button>
    </div>
  </form>

  <div class="bar">
    <div>
      <h2>Desejos</h2>
      <div class="count" id="count"></div>
    </div>
    <div class="sort" id="sort" role="group" aria-label="Ordenar">
      <button type="button" data-s="love" aria-pressed="true">Mais desejados</button>
      <button type="button" data-s="new" aria-pressed="false">Mais recentes</button>
    </div>
  </div>

  <div class="list" id="list"></div>
</div>

<div id="confirm" class="backdrop hidden">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirmText">
    <p id="confirmText"></p>
    <div class="btns">
      <button type="button" class="cancel" id="confirmNo">Manter</button>
      <button type="button" class="add" id="confirmYes">Remover</button>
    </div>
  </div>
</div>

<script>
// Cole aqui o endereço do App da Web do Google Apps Script (termina em /exec):
const API_URL = "https://script.google.com/macros/s/AKfycbzkqB3lrU76JcJJgLFPRt7pPizPSfbi_9TtNrPDklql7zCE2na9PeSFJrI9rIDo_zeL/exec";

(function(){
  const $ = (id) => document.getElementById(id);
  const WANT = ["", "Seria legal", "Quero bastante", "Quero muito"];
  const SVGNS = "http://www.w3.org/2000/svg";
  const HEART = "M12 21s-7.5-4.6-9.6-9.2C1 8.6 3 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5 19 5 21 8.6 19.6 11.8 17.5 16.4 12 21 12 21z";
  const PENCIL = "M4 20h4L19 9l-4-4L4 16z";
  const TRASH = "M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13";
  const state = { wishes:[], sort:"love", priority:2, editingId:null, loaded:false, busy:false };
  const configured = /^https:\/\/script\.google\.com\//.test(API_URL);

  (function(){
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let xmas = new Date(now.getFullYear(), 11, 25);
    if (today > xmas) xmas = new Date(now.getFullYear()+1, 11, 25);
    const d = Math.round((xmas - today) / 86400000);
    $("days").textContent = d === 0 ? "Hoje é Natal!" : (d === 1 ? "Falta 1 dia para o Natal" : "Faltam " + d + " dias para o Natal");
  })();

  function setStatus(msg, isErr){
    const el = $("status");
    if (!msg){ el.classList.add("hidden"); return; }
    el.textContent = msg; el.classList.toggle("err", !!isErr); el.classList.remove("hidden");
  }
  function safeUrl(raw){
    if (!raw) return null;
    let s = String(raw).trim();
    if (!/^https?:\/\//i.test(s)) s = "https://" + s;
    try { const u = new URL(s); if (u.protocol === "http:" || u.protocol === "https:") return u; } catch(e){}
    return null;
  }
  function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function icon(d, size, filled){
    const s = document.createElementNS(SVGNS, "svg");
    s.setAttribute("width", size); s.setAttribute("height", size); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true");
    const p = document.createElementNS(SVGNS, "path"); p.setAttribute("d", d);
    if (filled) p.setAttribute("fill", "currentColor");
    else { s.setAttribute("fill","none"); s.setAttribute("stroke","currentColor"); s.setAttribute("stroke-width","1.8"); s.setAttribute("stroke-linecap","round"); s.setAttribute("stroke-linejoin","round"); }
    s.appendChild(p); return s;
  }

  // ---------- Servidor (planilha do Google) ----------
  async function load(){
    const r = await fetch(API_URL, { method: "GET" });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || "erro");
    return data.wishes || [];
  }
  async function send(payload){
    const r = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || "erro");
    return data.wishes || [];
  }
  async function refresh(quiet){
    if (!configured || state.busy) return;
    try {
      state.wishes = await load();
      state.loaded = true;
      if (!$("status").classList.contains("err")) setStatus("");
    } catch(e){
      state.loaded = true;
      if (!quiet) setStatus("Não foi possível carregar a lista. Confira a internet e recarregue a página.", true);
    }
    render();
  }

  // ---------- Interface ----------
  function setPriority(p){
    state.priority = p;
    document.querySelectorAll("#wantPick button").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.p) === p)));
  }
  $("wantPick").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setPriority(Number(b.dataset.p)); });

  $("sort").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.sort = b.dataset.s;
    document.querySelectorAll("#sort button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    render();
  });

  function render(){
    const list = $("list");
    list.innerHTML = "";
    if (!state.loaded){ list.appendChild(el("div", "empty", "Carregando a lista…")); $("count").textContent = ""; return; }
    const items = state.wishes.slice().sort((a, b) => {
      if (state.sort === "love" && (b.priority||0) !== (a.priority||0)) return (b.priority||0) - (a.priority||0);
      return (b.createdAt||0) - (a.createdAt||0);
    });
    $("count").textContent = items.length === 0 ? "" : (items.length === 1 ? "1 desejo" : items.length + " desejos");
    if (!items.length){
      list.appendChild(el("div", "empty", "A lista ainda está vazia. Adicione o primeiro desejo aí em cima."));
      return;
    }
    for (const w of items){
      const card = el("article", "tag");
      const body = el("div", "body");
      body.appendChild(el("span", "title", String(w.title || "(sem nome)")));
      const p = Math.min(3, Math.max(1, Number(w.priority) || 1));
      const hearts = el("span", "hearts");
      for (let i = 0; i < p; i++) hearts.appendChild(icon(HEART, 14, true));
      hearts.appendChild(el("span", null, WANT[p]));
      body.appendChild(hearts);
      if (w.notes) body.appendChild(el("p", "notes", String(w.notes)));
      const u = safeUrl(w.link);
      if (w.price || u){
        const info = el("span", "info");
        if (w.price) info.appendChild(el("span", null, String(w.price)));
        if (u){
          const a = el("a", null, u.hostname.replace(/^www\./, ""));
          a.href = u.href; a.target = "_blank"; a.rel = "noopener noreferrer";
          info.appendChild(a);
        }
        body.appendChild(info);
      }
      card.appendChild(body);
      const tools = el("div", "tools");
      const eb = el("button", "icon"); eb.type = "button"; eb.setAttribute("aria-label", "Editar"); eb.title = "Editar";
      eb.appendChild(icon(PENCIL, 18, false)); eb.addEventListener("click", () => startEdit(w));
      const db = el("button", "icon"); db.type = "button"; db.setAttribute("aria-label", "Remover"); db.title = "Remover";
      db.appendChild(icon(TRASH, 18, false)); db.addEventListener("click", () => askDelete(w));
      tools.appendChild(eb); tools.appendChild(db);
      card.appendChild(tools);
      list.appendChild(card);
    }
  }

  function resetForm(){
    $("wishForm").reset(); setPriority(2); state.editingId = null;
    $("formTitle").textContent = "Adicionar um desejo";
    $("submitBtn").textContent = "Adicionar à lista";
    $("cancelEdit").classList.add("hidden");
  }
  function startEdit(w){
    state.editingId = w.id;
    $("fTitle").value = w.title || ""; $("fLink").value = w.link || ""; $("fPrice").value = w.price || ""; $("fNotes").value = w.notes || "";
    setPriority(Math.min(3, Math.max(1, Number(w.priority) || 2)));
    $("formTitle").textContent = "Editar desejo";
    $("submitBtn").textContent = "Salvar alterações";
    $("cancelEdit").classList.remove("hidden");
    $("wishForm").scrollIntoView({ behavior: "smooth", block: "start" });
    $("fTitle").focus({ preventScroll: true });
  }
  $("cancelEdit").addEventListener("click", resetForm);

  $("wishForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const title = $("fTitle").value.trim();
    if (!title){ $("fTitle").focus(); return; }
    if (!configured){ setStatus("O site ainda não foi ligado à planilha. Cole o link do Apps Script no arquivo index.html.", true); return; }
    const wish = { title, link: $("fLink").value.trim(), price: $("fPrice").value.trim(), notes: $("fNotes").value.trim(), priority: state.priority };
    const btn = $("submitBtn"); const label = btn.textContent;
    btn.disabled = true; btn.textContent = "Salvando…"; state.busy = true;
    try {
      state.wishes = state.editingId
        ? await send({ action: "update", id: state.editingId, wish })
        : await send({ action: "add", wish });
      resetForm(); setStatus(""); render();
    } catch(err){
      btn.textContent = label;
      setStatus("Não deu para salvar. Confira a internet e tente de novo.", true);
    } finally { btn.disabled = false; state.busy = false; if (btn.textContent === "Salvando…") btn.textContent = label; }
  });

  let pendingDelete = null;
  function closeConfirm(){ pendingDelete = null; $("confirm").classList.add("hidden"); }
  function askDelete(w){
    pendingDelete = w;
    $("confirmText").textContent = "Remover “" + (w.title || "este desejo") + "” da lista?";
    $("confirm").classList.remove("hidden");
    $("confirmNo").focus();
  }
  $("confirmNo").addEventListener("click", closeConfirm);
  $("confirm").addEventListener("click", (e) => { if (e.target.id === "confirm") closeConfirm(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && pendingDelete) closeConfirm(); });
  $("confirmYes").addEventListener("click", async () => {
    const w = pendingDelete; closeConfirm();
    if (!w || !configured) return;
    const before = state.wishes;
    state.wishes = state.wishes.filter(x => x.id !== w.id); render();
    state.busy = true;
    try { state.wishes = await send({ action: "delete", id: w.id }); if (state.editingId === w.id) resetForm(); }
    catch(err){ state.wishes = before; setStatus("Não deu para remover. Confira a internet e tente de novo.", true); }
    finally { state.busy = false; render(); }
  });

  // ---------- Início ----------
  render();
  if (!configured){
    state.loaded = true; render();
    setStatus("O site ainda não foi ligado à planilha. Cole o link do Apps Script no arquivo index.html.", true);
  } else {
    refresh(false);
    // Atualiza sozinho quando a pessoa volta para a aba
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(true); });
  }
})();
</script>
</body>
</html>
